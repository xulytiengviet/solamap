name: Deploy SolaMap RPC Worker
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solamap-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIMARY_RPC: ${{ secrets.SOLANA_RPC_PRIMARY }}
      BACKUP_RPC: ${{ secrets.SOLANA_RPC_BACKUP }}
    steps:
      - uses: actions/checkout@v5
      - name: Check required secrets without printing them
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRIMARY_RPC BACKUP_RPC; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret mapped to $name"
              exit 1
            fi
          done
          [[ "$PRIMARY_RPC" == https://* && "$BACKUP_RPC" == https://* ]] || { echo "::error::RPC endpoints must use HTTPS"; exit 1; }
      - name: Deploy worker from its own Wrangler config
        working-directory: cloudflare-rpc
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Install upstream RPC secrets into Cloudflare Worker
        working-directory: cloudflare-rpc
        shell: bash
        run: |
          printf '%s' "$PRIMARY_RPC" | npx --yes wrangler@4 secret put SOLANA_RPC_PRIMARY --config wrangler.toml
          printf '%s' "$BACKUP_RPC" | npx --yes wrangler@4 secret put SOLANA_RPC_BACKUP --config wrangler.toml
      - name: Health-check deployment (non-secret response only)
        shell: bash
        run: |
          curl -fsS --retry 3 --retry-delay 3 https://solamap.bilabot-cvnss4-71bd4651.workers.dev/health
